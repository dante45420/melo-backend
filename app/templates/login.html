<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Melo Admin</title>
  <style>
    :root {
      --melo-orange: #FF8C42;
      --melo-coral: #F06236;
      --melo-text: #2d2d2d;
      --melo-bg: #fafafa;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, sans-serif;
      background: var(--melo-bg);
      color: var(--melo-text);
    }
    .login {
      width: 100%;
      max-width: 360px;
      padding: 40px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    .login h1 {
      margin: 0 0 24px;
      font-size: 1.5rem;
      text-align: center;
    }
    .login label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
    }
    .login input {
      width: 100%;
      padding: 12px 16px;
      margin-bottom: 16px;
      border: 1px solid #eee;
      border-radius: 8px;
      font-size: 1rem;
    }
    .login input:focus {
      outline: none;
      border-color: var(--melo-coral);
    }
    .login button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--melo-orange), var(--melo-coral));
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    .login button:hover { opacity: 0.95; }
    .error {
      padding: 12px;
      margin-bottom: 16px;
      background: #fee;
      color: #c00;
      border-radius: 8px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="login">
    <h1>Melo Admin</h1>
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    <form method="POST" action="/login">
      <label for="user">Usuario</label>
      <input id="user" name="user" type="text" required autocomplete="username">
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" required autocomplete="current-password">
      <button type="submit">Entrar</button>
    </form>
  </div>
</body>
</html>
